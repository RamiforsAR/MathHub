<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Scramjet Browser</title>

    <link rel="shortcut icon" content="favicon.webp" />

    <!-- Scramjet + BareMux -->
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>

    <link rel="stylesheet" href="index.css" />
    <script src="register-sw.js" defer></script>
    <script src="search.js" defer></script>
    <script src="index.js" defer></script>
  </head>

  <body>
    <div class="browser-root">
      <!-- Top bar -->
      <header class="browser-header">
        <div class="browser-logo">
          <img class="logo" src="sj.png" alt="Scramjet" />
          <span>Scramjet Browser</span>
        </div>

        <form id="sj-form" class="browser-address-bar" autocomplete="off">
          <input
            id="sj-search-engine"
            value="https://www.google.com/search?q=%s"
            type="hidden"
          />
          <input
            id="sj-address"
            type="text"
            placeholder="Search or enter address"
          />
        </form>
      </header>

      <!-- Tabs bar -->
      <div class="tabs-bar" id="tabs-bar">
        <!-- Tabs injected here -->
        <button id="new-tab-btn" class="tab new-tab-btn" title="New tab">+</button>
      </div>

      <!-- Error area -->
      <div class="error-area">
        <p id="sj-error"></p>
        <pre id="sj-error-code"></pre>
      </div>

      <!-- Frames container -->
      <main id="frames-container" class="frames-container">
        <!-- Scramjet frames injected here -->
      </main>

      <footer>
        <div>
          <a
            title="The Mercury Workshop GitHub organization"
            href="https://github.com/MercuryWorkshop"
            >Mercury Workshop</a
          >
          <a
            title="The example demo app for Scramjet"
            href="https://github.com/MercuryWorkshop/Scramjet-Demo"
            >GitHub</a
          >
          <a title="License information" href="credits.html">Credits</a>
        </div>
        <div>
          <span>Scramjet &copy; MW 2025</span>
        </div>
      </footer>
    </div>
  </body>
</html>
